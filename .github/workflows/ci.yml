name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Static analysis (level max)
        run: composer run phpstan
      - name: Unit tests
        run: composer run test
      - name: Validate taw-schema/*.json (no WordPress)
        run: php bin/taw schema:validate
